[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "authrail"
version = "0.1.1"
description = "Python adapter for AuthRail's customer-side Runtime"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["cryptography>=46,<50", "httpx>=0.28,<1"]

[project.urls]
Documentation = "https://docs.authrail.io"
Repository = "https://github.com/AuthRail/authrail-sdk-python"

[project.optional-dependencies]
dev = ["build>=1.2,<2", "mypy>=1.15,<2", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
authrail = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
